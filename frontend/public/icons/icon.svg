<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1729" />
      <stop offset="100%" stop-color="#060E1A" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D" />
      <stop offset="50%" stop-color="#FA7722" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FF8A3D" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Deep Navy App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Vibrant Orange/Amber Badge with Shadow -->
  <rect x="80" y="80" width="352" height="352" rx="84" fill="url(#badgeGrad)" filter="url(#shadow)" />

  <!-- Inner Subtle Border Accent -->
  <rect x="82" y="82" width="348" height="348" rx="82" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4" />

  <!-- Mechanical Wrench Emblem (Clean White Vector Silhouette) -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Wrench Head -->
    <path d="M 256 112 
             C 216 112 184 144 184 184 
             C 184 204 192 222 205 235 
             L 240 200 
             L 272 200 
             L 272 232 
             L 237 267 
             C 243 270 249 272 256 272 
             C 296 272 328 240 328 200 
             L 300 200 
             C 294 175 275 156 250 150 
             L 250 120 
             Z" 
          fill="#FFFFFF" />
    
    <!-- Wrench Shaft & Base -->
    <path d="M 244 260 
             L 244 380 
             C 244 394 250 404 256 404 
             C 262 404 268 394 268 380 
             L 268 260 
             Z" 
          fill="#FFFFFF" />

    <!-- Solid Complete Ergonomic Silhouette (Combined Path) -->
    <path d="M280 130 C272 126 264 124 256 124 C218 124 188 154 188 192 C188 212 196 230 210 244 L238 272 L238 376 C238 388 246 398 256 398 C266 398 274 388 274 376 L274 272 L302 244 C316 230 324 212 324 192 C324 165 308 142 284 132 L260 168 L244 168 L244 184 L268 208 L256 220 L220 184 L244 160 L244 144 L280 130 Z" 
          fill="#FFFFFF" />
    
    <!-- Wrench Ring End (Double-Ended Box/Open Spanner) -->
    <circle cx="256" cy="380" r="28" fill="#FFFFFF" />
    <circle cx="256" cy="380" r="14" fill="url(#badgeGrad)" />
  </g>
</svg>
